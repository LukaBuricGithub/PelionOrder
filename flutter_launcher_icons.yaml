# App icon configuration (flutter_launcher_icons).
#
# Source images live in assets/icon/ (1254×1254 PNG):
#   icon_iOS.png         full icon, no transparency — iOS, and Android < 8
#   icon_background.png  Android adaptive icon background (plain navy #012045,
#                        the same navy as icon_iOS.png so both platforms match)
#   icon_foreground.png  Android adaptive icon foreground (white + cyan logo,
#                        transparent)
#   icon_monochrome.png  Android 13+ themed icon (logo shape, transparent)
#   icon_background_blue.png  unused alternative background (vivid blue
#                        #0062fe); swap it into adaptive_icon_background below
#                        for a blue Android icon instead of the navy one
#
# The foreground and monochrome images already carry their margin: the logo is
# cropped and re-padded to 50% of the canvas width, which is what fits inside
# Android's round/squircle masks. That is why the inset below is 0.
#
# Regenerate after changing anything here or in assets/icon/:
#   dart run flutter_launcher_icons
# v0.14.4 also rewrites ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS
# in ios/Runner.xcodeproj/project.pbxproj from YES to "AppIcon" (a bug) —
# discard that change afterwards:
#   git checkout -- ios/Runner.xcodeproj/project.pbxproj
flutter_launcher_icons:
  image_path: "assets/icon/icon_iOS.png"

  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  # The margin is baked into the source images (see above), so no extra inset.
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true
